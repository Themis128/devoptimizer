name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DEVOPT_ROOT: D:\DevOptimizer

jobs:
  build-app:
    name: Build & Test App (xUnit)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          # cache: true requires packages.lock.json (not present)

      - name: Restore
        run: dotnet restore app/DevOptimizer.App/DevOptimizer.App.csproj

      - name: Build
        run: dotnet build app/DevOptimizer.App/DevOptimizer.App.csproj --no-restore -c Release

      - name: Test (xUnit)
        run: dotnet test app/DevOptimizer.App.Tests/DevOptimizer.App.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunit-test-results
          path: ${{ github.workspace }}/TestResults/*.trx

  test-hub:
    name: Test Script Hub (Pester + Syntax)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests (CI mode, skip machine-specific)
        run: |
          cd scripts
          # Skip AppPackage tests (HKCU Uninstall, Start Menu) - machine-specific
          .\Test-App.ps1 -CI -Tag '!AppPackage'

      - name: Validate all scripts syntax (612 scripts)
        run: .\scripts\check-all-syntax.ps1 -RootPath ${{ github.workspace }}

  lint-registry:
    name: Lint Registry (Discover + Build + Validate)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover scripts
        run: .\Discover-Scripts.ps1 -RootPath ${{ github.workspace }} -OutputPath config/discovered-scripts.json -PassThru

      - name: Build and validate registry
        run: .\Build-Registry.ps1 -DiscoveryPath config/discovered-scripts.json -Validate -Force -RootPath ${{ github.workspace }}

      - name: Verify registry counts
        run: |
          $registry = Get-Content config/hub-registry.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $cmdCount = $registry.commands.Count
          $missingDesc = ($registry.commands | Where-Object { -not $_.description -or $_.description.Trim() -eq '' }).Count
          Write-Host "Commands: $cmdCount (expected 369)"
          Write-Host "Missing descriptions: $missingDesc (expected 0)"
          if ($cmdCount -ne 369) { throw "Command count mismatch: $cmdCount != 369" }
          if ($missingDesc -ne 0) { throw "$missingDesc commands missing descriptions" }

  security-scan:
    name: Security Scan (Mimosa)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
